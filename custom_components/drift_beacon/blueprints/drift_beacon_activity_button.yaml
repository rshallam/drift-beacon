blueprint:
  name: Drift Beacon Activity Controls
  description: >
    Choose how to track an activity and plan what comes next. Add triggers only for
    the actions you use. Every mapping is optional; add at least one to enable a
    control. Use any Home Assistant trigger.

    If your device emits overlapping events, such as a press followed by a double
    press, both mapped actions may run.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/rshallam/drift-beacon/blob/main/custom_components/drift_beacon/blueprints/drift_beacon_activity_button.yaml

  input:
    activity:
      name: Activity
      description: >
        Choose an entity for the activity you want to control. Its Session switch,
        Pin switch, or point-activity button all identify the same activity.
        Do not select the workspace's Stop session button.
      selector:
        entity:
          filter:
            - integration: drift_beacon
              domain:
                - switch
                - button

    track_now:
      name: Track now
      icon: mdi:play-pause
      description: >
        These actions affect the selected activity. Starting a timed activity ends
        your other live session; marking a point activity leaves it running.
      input:
        track_trigger:
          name: Track activity
          description: >
            For timed activities, start tracking or stop if already running.
            For point activities, record one occurrence.
          default: []
          selector:
            trigger:
        pause_trigger:
          name: Pause activity
          description: >
            End this activity's live session and pin it for later.
            Applies to timed activities only.
          default: []
          selector:
            trigger:

    plan_ahead:
      name: Plan ahead
      icon: mdi:playlist-plus
      collapsed: true
      description: >
        Keep an activity ready or add it to your queue. These actions don't start tracking.
      input:
        pin_trigger:
          name: Pin activity
          description: >
            Make this your pinned activity. Your previous pin moves to the front of the queue.
          default: []
          selector:
            trigger:
        queue_trigger:
          name: Queue activity
          description: >
            Add this activity to the back of your queue. With auto-advance on and nothing
            pinned, pin it immediately. Each trigger can add another queue entry.
          default: []
          selector:
            trigger:
        unpin_trigger:
          name: Unpin activity
          description: >
            Unpin this activity if it is pinned. With auto-advance on, the next queued
            activity becomes pinned.
          default: []
          selector:
            trigger:

    current_session:
      name: Current session controls
      icon: mdi:timer-outline
      collapsed: true
      description: >
        These follow the connected user's live session in this workspace, even when
        it belongs to a different activity. Ending a shared session ends it for all
        its members.
      input:
        pause_current_trigger:
          name: Pause current session
          description: >
            End your live session and pin its activity to return to later.
            Your previous pin moves to the front of the queue.
          default: []
          selector:
            trigger:
        stop_current_trigger:
          name: Stop current session
          description: End your live session, whichever activity it belongs to.
          default: []
          selector:
            trigger:

mode: queued
max: 5
max_exceeded: silent

triggers:
  - triggers: !input track_trigger
  - triggers: !input pause_trigger
  - triggers: !input pin_trigger
  - triggers: !input queue_trigger
  - triggers: !input unpin_trigger
  - triggers: !input pause_current_trigger
  - triggers: !input stop_current_trigger

variables:
  trigger_groups:
    - name: track_activity
      triggers: !input track_trigger
    - name: pause_activity
      triggers: !input pause_trigger
    - name: pin_activity
      triggers: !input pin_trigger
    - name: queue_activity
      triggers: !input queue_trigger
    - name: unpin_activity
      triggers: !input unpin_trigger
    - name: pause_current
      triggers: !input pause_current_trigger
    - name: stop_current
      triggers: !input stop_current_trigger
  # Merged trigger lists receive a flat index, independent of user-supplied IDs.
  # Empty groups contribute no positions; a manual run without a trigger does nothing.
  activity_action: >-
    {%- set index = trigger.idx | int(-1) if trigger is defined else -1 -%}
    {%- set selected = namespace(offset=0, action='') -%}
    {%- for group in trigger_groups -%}
      {%- set count = group.triggers | length -%}
      {%- if selected.offset <= index < selected.offset + count -%}
        {%- set selected.action = group.name -%}
      {%- endif -%}
      {%- set selected.offset = selected.offset + count -%}
    {%- endfor -%}
    {{ selected.action }}

actions:
  - choose:
      - conditions: >-
          {{ activity_action in ['track_activity', 'pause_activity', 'pin_activity',
                                  'queue_activity', 'unpin_activity'] }}
        sequence:
          - action: "{{ 'drift_beacon.' ~ activity_action }}"
            target:
              entity_id: !input activity
      - conditions: "{{ activity_action in ['pause_current', 'stop_current'] }}"
        sequence:
          - action: drift_beacon.stop_session
            target:
              entity_id: !input activity
            data:
              pause: "{{ activity_action == 'pause_current' }}"

blueprint:
  name: Drift Beacon Activity Lighting
  description: >
    Event-driven automation for controlling lights based on Drift Beacon sessions and
    pinned activities.

  domain: automation
  source_url: https://github.com/rshallam/drift-beacon/blob/main/ha-integration/blueprints/drift_beacon_activity_lighting_events.yaml

  input:
    workspace:
      name: Workspace
      description: Select the Drift Beacon workspace whose activity events should control these lights
      selector:
        device:
          integration: drift_beacon

    target_lights:
      name: Target Lights
      description: The lights or light groups to control based on active activity
      selector:
        target:
          entity:
            - domain: light

    session_brightness:
      name: Session Brightness
      description: Brightness level for the lights while a session is live (0-100%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

    pinned_brightness:
      name: Pinned Brightness
      description: Brightness level for the lights when an activity is pinned but no session is live (0-100%)
      default: 5
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

    transition:
      name: Transition Time
      description: Time to transition between colors (in seconds)
      default: 0
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: "s"
          mode: slider
          step: 0.5

    off_transition:
      name: Turn Off Transition Time
      description: Time to transition when turning off lights (in seconds)
      default: 0
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: "s"
          mode: slider
          step: 0.5

    disable_when:
      name: Disable When (Optional)
      description: Pause activity lighting when these conditions are met. Leave empty to always run.
      default: []
      selector:
        condition:

mode: restart
max_exceeded: silent

variables:
  workspace_device: !input workspace
  selected_workspace_id: >-
    {%- set selected = namespace(id='') -%}
    {%- for domain, identifier in device_attr(workspace_device, 'identifiers') or [] -%}
      {%- if domain == 'drift_beacon' -%}
        {%- set selected.id = identifier -%}
      {%- endif -%}
    {%- endfor -%}
    {{ selected.id }}
  session_brightness: !input session_brightness
  pinned_brightness: !input pinned_brightness
  transition: !input transition
  off_transition: !input off_transition
  disable_conditions: !input disable_when

trigger:
  - platform: event
    event_type: drift_beacon_session_started
    id: session_started

  - platform: event
    event_type: drift_beacon_session_changed
    id: session_changed

  - platform: event
    event_type: drift_beacon_session_stopped
    id: session_stopped

  - platform: event
    event_type: drift_beacon_activity_pinned
    id: activity_pinned

  - platform: event
    event_type: drift_beacon_activity_unpinned
    id: activity_unpinned

condition:
  - condition: template
    value_template: >-
      {{ selected_workspace_id != '' and
         trigger.event.data.workspace_id == selected_workspace_id }}

action:
  - if: "{{ disable_conditions | length > 0 }}"
    then:
      # Disable conditions are set, check if they're true
      - if: !input disable_when
        then: []  # Conditions met, skip automation
        else:
          - choose:
              # Session started or changed -> session lighting (highest priority)
              - conditions:
                  - condition: or
                    conditions:
                      - condition: trigger
                        id: session_started
                      - condition: trigger
                        id: session_changed
                sequence:
                  - action: light.turn_on
                    target: !input target_lights
                    data:
                      rgb_color: "{{ trigger.event.data.color }}"
                      brightness_pct: !input session_brightness
                      transition: !input transition

              # Session stopped -> pinned lighting takes over if something is still
              # pinned, otherwise off
              - conditions:
                  - condition: trigger
                    id: session_stopped
                sequence:
                  - if: "{{ trigger.event.data.pinned_activity_id is not none }}"
                    then:
                      - action: light.turn_on
                        target: !input target_lights
                        data:
                          rgb_color: "{{ trigger.event.data.pinned_color }}"
                          brightness_pct: !input pinned_brightness
                          transition: !input transition
                    else:
                      - action: light.turn_off
                        target: !input target_lights
                        data:
                          transition: !input off_transition

              # Activity pinned -> pinned lighting, unless a session is already live
              - conditions:
                  - condition: trigger
                    id: activity_pinned
                  - condition: template
                    value_template: "{{ not trigger.event.data.has_live_session }}"
                sequence:
                  - action: light.turn_on
                    target: !input target_lights
                    data:
                      rgb_color: "{{ trigger.event.data.color }}"
                      brightness_pct: !input pinned_brightness
                      transition: !input transition

              # Activity unpinned -> off, unless a session is already live
              - conditions:
                  - condition: trigger
                    id: activity_unpinned
                  - condition: template
                    value_template: "{{ not trigger.event.data.has_live_session }}"
                sequence:
                  - action: light.turn_off
                    target: !input target_lights
                    data:
                      transition: !input off_transition
    else:
      # No disable conditions set, always run
      - choose:
          # Session started or changed -> session lighting (highest priority)
          - conditions:
              - condition: or
                conditions:
                  - condition: trigger
                    id: session_started
                  - condition: trigger
                    id: session_changed
            sequence:
              - action: light.turn_on
                target: !input target_lights
                data:
                  rgb_color: "{{ trigger.event.data.color }}"
                  brightness_pct: !input session_brightness
                  transition: !input transition

          # Session stopped -> pinned lighting takes over if something is still
          # pinned, otherwise off
          - conditions:
              - condition: trigger
                id: session_stopped
            sequence:
              - if: "{{ trigger.event.data.pinned_activity_id is not none }}"
                then:
                  - action: light.turn_on
                    target: !input target_lights
                    data:
                      rgb_color: "{{ trigger.event.data.pinned_color }}"
                      brightness_pct: !input pinned_brightness
                      transition: !input transition
                else:
                  - action: light.turn_off
                    target: !input target_lights
                    data:
                      transition: !input off_transition

          # Activity pinned -> pinned lighting, unless a session is already live
          - conditions:
              - condition: trigger
                id: activity_pinned
              - condition: template
                value_template: "{{ not trigger.event.data.has_live_session }}"
            sequence:
              - action: light.turn_on
                target: !input target_lights
                data:
                  rgb_color: "{{ trigger.event.data.color }}"
                  brightness_pct: !input pinned_brightness
                  transition: !input transition

          # Activity unpinned -> off, unless a session is already live
          - conditions:
              - condition: trigger
                id: activity_unpinned
              - condition: template
                value_template: "{{ not trigger.event.data.has_live_session }}"
            sequence:
              - action: light.turn_off
                target: !input target_lights
                data:
                  transition: !input off_transition
